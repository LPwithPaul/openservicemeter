# Diese Datei nach ~/openservicemeter/docker-compose.yml kopieren bzw. in eine
# bestehende docker-compose.yml unter "services:" einfügen, und hinter Caddy
# als Reverse Proxy mit TLS veröffentlichen.
#
# Erwartet eine .env-Datei im selben Ordner wie diese docker-compose.yml
# (siehe .env.example). "docker compose" lädt eine .env automatisch, wenn sie
# neben der Compose-Datei liegt - kein extra env_file-Eintrag nötig.
#
# openservicemeter-db ist eine eigene, dedizierte Postgres-Instanz nur für
# dieses Projekt - kein Testservice, den man später wieder entfernt.

services:
  api:
    build: ./backend
    restart: unless-stopped
    environment:
      LOG_ENABLED: "true"          # Konsolen-Logging pro empfangener Stimme an/aus
      SQL_WRITE_ENABLED: "true"    # DB-Schreiben an/aus
      PG_CONN_STR: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}"
      API_KEYS: "${API_KEYS}"
    ports:
      - "${API_PORT}:8000"
    depends_on:
      - db

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    volumes:
      - openservicemeter-db-data:/var/lib/postgresql/data
    # Port nach außen ist optional - nur nötig, wenn du z.B. mit einem
    # externen SQL-Client oder Grafana direkt von außen auf die DB willst.
    ports:
      - "5432:5432"

volumes:
  openservicemeter-db-data: